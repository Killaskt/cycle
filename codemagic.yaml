workflows:
  ios-testflight:
    name: Tortoise Method iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: DevHiveX Key
    environment:
      groups:
        - tortoise_method_production
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tortoisemethod.app
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Verify production configuration
        script: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
      - name: Verify hosted Supabase anonymous auth
        script: npm run verify:production-auth
      - name: Build web app
        script: 'VITE_APP_VERSION="$BUILD_NUMBER" npm run build'
      - name: Sync web build to iOS
        script: npx cap sync ios
      - name: Set iOS build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Apply App Store signing profile
        script: |
          cd ios/App
          xcode-project use-profiles --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme App
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
