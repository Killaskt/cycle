name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Start local Supabase stack
        run: npx -y supabase@latest start

      - name: Run tests
        run: npm test

      - name: Stop local Supabase stack
        if: always()
        run: npx -y supabase@latest stop
